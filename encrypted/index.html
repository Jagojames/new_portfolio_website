<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jago Livingstone — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #080808;
      --surface: #111111;
      --border:  #202020;
      --text:    #FFFFFF;
      --muted:   #666666;
      --orange:  #F97316;
      --mono:    'Courier New', Courier, monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle dot grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, #1a1a1a 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }

    /* Radial glow */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 40%, rgba(249,115,22,0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .login-wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
    }

    /* Eyebrow */
    .login-eyebrow {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 20px;
    }

    /* Name */
    .login-name {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .login-role {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 36px;
      font-weight: 400;
    }

    /* Divider */
    .login-divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 32px;
    }

    .login-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      display: block;
    }

    #staticrypt-password {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
      letter-spacing: 0.04em;
    }

    #staticrypt-password:focus {
      border-color: var(--orange);
    }

    #staticrypt-password::placeholder {
      color: #333333;
    }

    #staticrypt-decrypt-button {
      width: 100%;
      background: var(--orange);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 14px 24px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      font-family: inherit;
    }

    #staticrypt-decrypt-button:hover {
      opacity: 0.88;
      transform: scale(1.01);
    }

    #staticrypt-decrypt-button:active {
      transform: scale(0.99);
    }

    /* Remember me */
    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    #staticrypt-remember {
      width: 15px;
      height: 15px;
      accent-color: var(--orange);
      cursor: pointer;
    }

    .remember-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    /* Error message */
    #staticrypt-message {
      margin-top: 16px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: #ef4444;
      text-align: center;
      min-height: 18px;
    }

    /* Footer */
    .login-footer {
      margin-top: 32px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      color: #2a2a2a;
      text-align: center;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-eyebrow">// Portfolio</div>
      <div class="login-name">Jago Livingstone</div>
      <div class="login-role">Lead Product Designer</div>
      <div class="login-divider"></div>

      <label class="login-label" for="staticrypt-password">Password</label>
      <input
        type="password"
        id="staticrypt-password"
        placeholder="Enter password to continue"
        autofocus
      >

      <div class="remember-wrap">
        <input type="checkbox" id="staticrypt-remember" checked>
        <label class="remember-label" for="staticrypt-remember">Remember me for 7 days</label>
      </div>

      <button id="staticrypt-decrypt-button">Enter Portfolio →</button>

      <div id="staticrypt-message"></div>
    </div>

    <div class="login-footer">jagojames@gmail.com</div>
  </div>
</body>
</html>
